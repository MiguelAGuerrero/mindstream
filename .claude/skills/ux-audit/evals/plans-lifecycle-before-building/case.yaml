schema_version: "1.1"
name: plans-lifecycle-before-building
expected_outcome: |
  The plan addresses the feature's whole lifecycle before any code: how focus mode is left early (a visible way to exit that works by tap), what happens to the timer and the half-written takeaway if the app is closed or the article is deleted mid-session, where an unfinished session is found again, and that skipping the takeaway prompt is an allowed ending.
  It asks about or decides whether leaving early discards or keeps progress, preferring the option that does not lose work.
  It is presented as a plan or table of questions and answers, not as code.
