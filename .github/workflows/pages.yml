# Build Mindstream and publish it to GitHub Pages on every push to master.
# One-time setup in the repository: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Leave-halfway check at phone size: everything started can be ended, and
      # nothing is left listed as unfinished with no way to end it (CLAUDE.md).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: leave-halfway-failures
          path: e2e/failure-*.png
          if-no-files-found: ignore
      - run: npm run build
        env:
          # Served from https://<owner>.github.io/<repo>/, not the site root.
          BASE_PATH: /${{ github.event.repository.name }}/
      # Single-page app: unknown paths (deep links, refresh) fall back to the app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
