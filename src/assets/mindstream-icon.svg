<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!-- Background -->
  <rect x="10" y="10" width="180" height="180" rx="40" fill="rgb(var(--v-theme-primary))"/>
  <!-- The "mind" — focal origin point -->
  <circle cx="54" cy="100" r="14" fill="rgb(var(--v-theme-on-primary))"/>
  <!-- Upper stream -->
  <path d="M 54,86 C 92,83 134,61 170,52"
        stroke="rgb(var(--v-theme-on-primary))" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- Main stream -->
  <line x1="68" y1="100" x2="170" y2="100"
        stroke="rgb(var(--v-theme-on-primary))" stroke-width="13" stroke-linecap="round"/>
  <!-- Lower stream -->
  <path d="M 54,114 C 92,117 134,139 170,148"
        stroke="rgb(var(--v-theme-on-primary))" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
